<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | Controle Financeiro</title>
    <meta name="description" content="Acesse sua conta e organize receitas, despesas, contas a pagar e metas financeiras." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-head">
          <div class="login-logo">💰</div>
          <h1>Controle Financeiro</h1>
          <p>Organize receitas, despesas, contas e metas em um só lugar.</p>
        </div>

        <div class="tabs" id="tabs">
          <button class="ativo" data-aba="login">Entrar</button>
          <button data-aba="cadastro">Criar conta</button>
        </div>

        <!-- LOGIN -->
        <form id="form-login">
          <div class="campo">
            <label for="login-email">E-mail</label>
            <input id="login-email" type="email" required placeholder="voce@email.com" />
          </div>
          <div class="campo">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" required placeholder="••••••••" />
          </div>
          <button class="btn btn-bloco" type="submit">Entrar</button>
          <button type="button" class="link-btn" id="btn-esqueci">Esqueci minha senha</button>
        </form>

        <!-- CADASTRO -->
        <form id="form-cadastro" style="display: none">
          <div class="campo">
            <label for="cad-nome">Nome</label>
            <input id="cad-nome" required maxlength="100" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <label for="cad-email">E-mail</label>
            <input id="cad-email" type="email" required placeholder="voce@email.com" />
          </div>
          <div class="campo">
            <label for="cad-senha">Senha</label>
            <input id="cad-senha" type="password" required minlength="6" placeholder="Mínimo 6 caracteres" />
          </div>
          <button class="btn btn-bloco" type="submit">Criar conta</button>
        </form>

        <!-- RECUPERAR -->
        <form id="form-recuperar" style="display: none">
          <div class="campo">
            <label for="rec-email">E-mail</label>
            <input id="rec-email" type="email" required placeholder="voce@email.com" />
          </div>
          <button class="btn btn-bloco" type="submit">Enviar link de recuperação</button>
          <button type="button" class="link-btn" id="btn-voltar">Voltar para o login</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
      const formLogin = document.getElementById("form-login");
      const formCadastro = document.getElementById("form-cadastro");
      const formRecuperar = document.getElementById("form-recuperar");
      const tabs = document.getElementById("tabs");

      function mostrar(aba) {
        formLogin.style.display = aba === "login" ? "block" : "none";
        formCadastro.style.display = aba === "cadastro" ? "block" : "none";
        formRecuperar.style.display = aba === "recuperar" ? "block" : "none";
        tabs.style.display = aba === "recuperar" ? "none" : "flex";
        [...tabs.children].forEach((b) => b.classList.toggle("ativo", b.dataset.aba === aba));
      }

      tabs.addEventListener("click", (e) => {
        if (e.target.dataset.aba) mostrar(e.target.dataset.aba);
      });
      document.getElementById("btn-esqueci").onclick = () => mostrar("recuperar");
      document.getElementById("btn-voltar").onclick = () => mostrar("login");

      // Já logado? vai direto pro dashboard
      usuarioAtual().then((u) => { if (u) location.href = "dashboard.html"; });

      formLogin.onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await db.auth.signInWithPassword({
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-senha").value,
        });
        if (error) return toast(error.message, "erro");
        location.href = "dashboard.html";
      };

      formCadastro.onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await db.auth.signUp({
          email: document.getElementById("cad-email").value,
          password: document.getElementById("cad-senha").value,
          options: {
            data: { nome: document.getElementById("cad-nome").value.trim() },
            emailRedirectTo: location.origin + location.pathname.replace("index.html", "dashboard.html"),
          },
        });
        if (error) return toast(error.message, "erro");
        toast("Conta criada! Você já pode entrar.", "ok");
        mostrar("login");
      };

      formRecuperar.onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await db.auth.resetPasswordForEmail(
          document.getElementById("rec-email").value,
          { redirectTo: location.origin + location.pathname.replace("index.html", "redefinir-senha.html") }
        );
        if (error) return toast(error.message, "erro");
        toast("Enviamos um link para o seu e-mail.", "ok");
        mostrar("login");
      };
    </script>
  </body>
</html>
