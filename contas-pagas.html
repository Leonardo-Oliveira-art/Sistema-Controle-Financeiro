<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contas Pagas | Controle Financeiro</title>
    <meta name="description" content="Histórico das contas já quitadas, com valores e datas de pagamento." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="conteudo">
        <header class="topbar" id="topbar"></header>
        <main>
          <div class="barra-topo"><h2>Contas Pagas</h2></div>

          <div class="grid grid-2" style="margin-bottom: 16px">
            <div class="card"><h3>Total pago</h3><div class="valor verde" id="total">R$ 0,00</div></div>
            <div class="card"><h3>Contas quitadas</h3><div class="valor" id="qtd">0</div></div>
          </div>

          <div class="filtros">
            <input id="filtro-busca" placeholder="Buscar por conta ou fornecedor..." />
          </div>

          <div class="card tabela-wrap">
            <table>
              <thead>
                <tr><th>Pago em</th><th>Conta</th><th>Categoria</th><th>Prioridade</th><th>Situação</th><th>Valor</th><th>Ações</th></tr>
              </thead>
              <tbody id="corpo-tabela"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/contas.js"></script>
    <script>
      iniciarContas("pago");
    </script>
  </body>
</html>
