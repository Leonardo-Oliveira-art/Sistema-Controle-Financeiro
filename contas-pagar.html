<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contas a Pagar | Controle Financeiro</title>
    <meta name="description" content="Controle vencimentos, prioridades e situação das suas contas a pagar." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="conteudo">
        <header class="topbar" id="topbar"></header>
        <main>
          <div class="barra-topo">
            <h2>Contas a Pagar</h2>
            <span class="espaco"></span>
            <button class="btn" id="btn-novo">+ Nova conta</button>
          </div>

          <div class="grid grid-4" style="margin-bottom: 16px">
            <div class="card"><h3>Total em aberto</h3><div class="valor amarelo" id="total">R$ 0,00</div></div>
            <div class="card"><h3>Contas</h3><div class="valor" id="qtd">0</div></div>
            <div class="card"><h3>Vencidas</h3><div class="valor vermelho" id="vencidas">0</div></div>
          </div>

          <div class="filtros">
            <input id="filtro-busca" placeholder="Buscar por conta ou fornecedor..." />
            <select id="filtro-situacao">
              <option value="">Todas as situações</option>
              <option value="pendente">Pendentes</option>
              <option value="vencido">Vencidas</option>
            </select>
          </div>

          <div class="card tabela-wrap">
            <table>
              <thead>
                <tr><th>Vencimento</th><th>Conta</th><th>Categoria</th><th>Prioridade</th><th>Situação</th><th>Valor</th><th>Ações</th></tr>
              </thead>
              <tbody id="corpo-tabela"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-caixa">
        <h3 id="modal-titulo">Nova conta</h3>
        <form id="form">
          <div class="campo"><label for="f-nome">Nome da conta</label><input id="f-nome" required maxlength="120" /></div>
          <div class="linha-2">
            <div class="campo"><label for="f-valor">Valor (R$)</label><input id="f-valor" type="number" step="0.01" min="0" required /></div>
            <div class="campo"><label for="f-vencimento">Vencimento</label><input id="f-vencimento" type="date" required /></div>
          </div>
          <div class="linha-2">
            <div class="campo"><label for="f-fornecedor">Fornecedor</label><input id="f-fornecedor" maxlength="120" /></div>
            <div class="campo"><label for="f-categoria">Categoria</label><select id="f-categoria"></select></div>
          </div>
          <div class="linha-2">
            <div class="campo">
              <label for="f-prioridade">Prioridade</label>
              <select id="f-prioridade">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="campo"><label for="f-parcelas">Nº de parcelas</label><input id="f-parcelas" type="number" min="1" value="1" /></div>
          </div>
          <div class="campo"><label for="f-observacoes">Observações</label><textarea id="f-observacoes" rows="3"></textarea></div>
          <div class="modal-acoes">
            <button type="button" class="btn btn-cinza" id="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/contas.js"></script>
    <script>
      iniciarContas("pendente");
    </script>
  </body>
</html>
