<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Despesas | Controle Financeiro</title>
    <meta name="description" content="Registre despesas fixas, variáveis e parceladas e acompanhe seus gastos." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="conteudo">
        <header class="topbar" id="topbar"></header>
        <main>
          <div class="barra-topo">
            <h2>Despesas</h2>
            <span class="espaco"></span>
            <button class="btn" id="btn-novo">+ Nova despesa</button>
          </div>

          <div class="grid grid-2" style="margin-bottom: 16px">
            <div class="card"><h3>Total filtrado</h3><div class="valor vermelho" id="total">R$ 0,00</div></div>
            <div class="card"><h3>Lançamentos</h3><div class="valor" id="qtd">0</div></div>
          </div>

          <div class="filtros">
            <input id="filtro-busca" placeholder="Buscar por título..." />
            <select id="filtro-categoria"></select>
            <input id="filtro-de" type="date" />
            <input id="filtro-ate" type="date" />
          </div>

          <div class="card tabela-wrap">
            <table>
              <thead>
                <tr><th>Data</th><th>Título</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Ações</th></tr>
              </thead>
              <tbody id="corpo-tabela"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-caixa">
        <h3 id="modal-titulo">Nova despesa</h3>
        <form id="form">
          <div class="campo"><label for="f-titulo">Título</label><input id="f-titulo" required maxlength="120" /></div>
          <div class="linha-2">
            <div class="campo"><label for="f-valor">Valor (R$)</label><input id="f-valor" type="number" step="0.01" min="0" required /></div>
            <div class="campo"><label for="f-data">Data</label><input id="f-data" type="date" required /></div>
          </div>
          <div class="linha-2">
            <div class="campo"><label for="f-categoria">Categoria</label><select id="f-categoria"></select></div>
            <div class="campo">
              <label for="f-tipo">Tipo</label>
              <select id="f-tipo">
                <option value="fixa">Fixa</option>
                <option value="variavel">Variável</option>
                <option value="parcelada">Parcelada</option>
              </select>
            </div>
          </div>
          <div class="campo"><label for="f-descricao">Descrição</label><textarea id="f-descricao" rows="3"></textarea></div>
          <div class="modal-acoes">
            <button type="button" class="btn btn-cinza" id="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/lancamentos.js"></script>
    <script>
      iniciarLancamentos({ tabela: "despesas", titulo: "Despesas", tipoCategoria: "despesa", comTipoDespesa: true });
    </script>
  </body>
</html>
